<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Netherbloom · Play log</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
/* The play log: who signed in, which games were played and for how long. Read-only, for the site owner. */
.log-wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.log-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; justify-content: space-between; }
.log-head h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; border: 1px solid var(--ash); border-radius: 10px; background: rgba(33,30,37,.88); display: grid; gap: 2px; }
.tile b { font-family: var(--display); font-weight: 400; font-size: 2rem; color: var(--bone); font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mist); }
.scrollx { overflow-x: auto; border: 1px solid var(--ash); border-radius: 10px; background: rgba(23,22,27,.8); }
table.log { display: table; width: 100%; border-collapse: collapse; font-size: .9rem; }
table.log thead { display: table-header-group; } table.log tbody { display: table-row-group; } table.log tr { display: table-row; }
table.log th, table.log td { display: table-cell; }
.log-wrap a { color: var(--cyan); }
table.log th, table.log td { text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(74,70,66,.6); white-space: nowrap; font-variant-numeric: tabular-nums; }
table.log th { font-family: var(--mono); font-weight: 500; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mist); position: sticky; top: 0; background: #1b191f; }
table.log td.names { white-space: normal; min-width: 160px; }
.res-win { color: var(--cyan); } .res-lose { color: var(--crimson); } .res-open { color: var(--mist); }
.empty { padding: 18px; color: var(--mist); }
.note { color: var(--mist); max-width: 75ch; margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select { padding: 5px 8px; }
h2.sec { font-size: 1.3rem; margin: 6px 0 0; }
button.view { padding: 3px 10px; font-size: .8rem; }
tr.picked td { background: rgba(230,211,163,.08); }
/* One game's end-of-game record */
.game { border: 1px solid var(--ash); border-radius: 12px; background: rgba(23,22,27,.9); padding: 16px; display: grid; gap: 14px; scroll-margin-top: 12px; }
.game h2 { margin: 0; font-size: 1.5rem; }
.game .why { margin: 0; color: var(--paper); max-width: 90ch; }
.game .why b.lose { color: var(--crimson); } .game .why b.win { color: var(--cyan); }
.gboard { width: 100%; height: auto; display: block; border-radius: 10px; background: #121117; }
.gboard text { font-family: var(--mono); font-size: 12px; fill: var(--mist); }
.ggrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.gcard { border: 1px solid rgba(74,70,66,.7); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.gcard h3 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mist); }
.gcard .big { font-family: var(--display); font-size: 1.6rem; color: var(--bone); line-height: 1.1; }
.gcard ul { margin: 0; padding-left: 18px; } .gcard li { margin: 1px 0; }
.gcard .thread { display: flex; gap: 6px; align-items: center; }
.gcard .thread i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--mist); display: inline-block; }
.gcard .thread i.on { background: var(--bone); border-color: var(--bone); }
.gcard .muted { color: var(--mist); }
.gcard svg.ic { width: 16px; height: 16px; vertical-align: -3px; }
.chron { max-height: 420px; overflow: auto; border: 1px solid rgba(74,70,66,.7); border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
.chron h4 { margin: 10px 0 2px; font-family: var(--mono); font-weight: 500; font-size: .7rem; letter-spacing: .1em; color: var(--bone); text-transform: uppercase; }
.chron div.k-loss, .chron div.k-fracture, .chron div.k-backlash, .chron div.k-forget { color: #f0a0aa; }
.chron div.k-win, .chron div.k-bloom, .chron div.k-inscribe { color: #bfe9ef; }
</style>
</head>
<body>
<div class="coverbg" aria-hidden="true"></div>
<main class="app log-wrap" id="logapp">
  <div class="log-head"><h1>Play log</h1><span><a href="/">Back to the game</a></span></div>
  <p class="note" id="status">Loading…</p>
</main>
<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const SOULS = { child: "Child of the Last Flame", garland: "The Garland Girl", king: "The King on the Barge", bride: "The Bride Who Stayed Below", open: "Open Crossing" };
const LANTERNS = { 1: "Gentle", 2: "Standard", 3: "Hard", 4: "Heroic" };
const MODES = { solo: "Solo", local: "Same screen", online: "Online" };
const when = iso => new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const mins = (a, b) => Math.max(0, (new Date(b) - new Date(a)) / 60000);
const dur = m => m < 1 ? "under 1 min" : m < 60 ? `${Math.round(m)} min` : `${Math.floor(m / 60)} h ${Math.round(m % 60)} min`;
const place = r => [r.city, r.country].filter(Boolean).join(", ") || "—";

try { const sv = await fetch("/assets/symbols.svg"); if (sv.ok) { const h = document.createElement("div"); h.innerHTML = await sv.text(); document.body.prepend(h.firstElementChild); } } catch { /* icons are decoration */ }
const r = await fetch("/api/stats", { cache: "no-store" });
if (r.status === 401 || r.redirected) location.href = "/login";
const d = await r.json().catch(() => ({ ok: false, error: "The play log could not be read." }));
const app = $("#logapp");
if (!d.ok) { $("#status").textContent = d.error || "The play log could not be read."; }
else if (!d.logging) {
  $("#status").innerHTML = "The play log is not switched on yet. In Vercel, open the <b>netherbloom</b> project, go to <b>Storage</b>, create a <b>Blob</b> store (private) and connect it to this project, then redeploy. Sign-ins and games are recorded from then on.";
} else {
  const S = d.sessions, Lg = d.logins;
  const total = S.reduce((t, s) => t + mins(s.start, s.last), 0);
  const users = new Set([...S.map(s => s.user), ...Lg.map(l => l.user)]);
  const lost = s => s.result === "loss" || s.result === "lose";
  const finished = S.filter(s => s.result === "win" || lost(s));
  const wins = finished.filter(s => s.result === "win").length;
  const resCell = s => s.result === "win" ? `<span class="res-win">Crossed</span>` : lost(s) ? `<span class="res-lose">Lost${s.cause ? ": " + esc(s.cause) : ""}</span>` : s.result === "left" ? `<span class="res-open">Left early</span>` : `<span class="res-open">In progress / closed</span>`;
  // per account
  const per = {};
  for (const u of users) per[u] = { logins: 0, games: 0, minutes: 0, last: "" };
  for (const l of Lg) { per[l.user].logins++; if (l.at > per[l.user].last) per[l.user].last = l.at; }
  for (const s of S) { per[s.user].games++; per[s.user].minutes += mins(s.start, s.last); if (s.last > per[s.user].last) per[s.user].last = s.last; }
  app.innerHTML = `
  <div class="log-head"><h1>Play log</h1><span><a href="/">Back to the game</a></span></div>
  <section class="tiles">
    <div class="tile"><b>${S.length}</b><span>Games started</span></div>
    <div class="tile"><b>${dur(total).replace(" min", "m").replace(" h ", "h ")}</b><span>Total play time</span></div>
    <div class="tile"><b>${finished.length ? Math.round(wins / finished.length * 100) + "%" : "—"}</b><span>Crossings won (${finished.length} finished)</span></div>
    <div class="tile"><b>${users.size}</b><span>Accounts seen</span></div>
    <div class="tile"><b>${Lg.length}</b><span>Sign-ins</span></div>
  </section>
  <h2 class="sec">By account</h2>
  <div class="scrollx"><table class="log"><thead><tr><th>Account</th><th>Sign-ins</th><th>Games</th><th>Play time</th><th>Last seen</th></tr></thead><tbody>
    ${Object.entries(per).sort((a, b) => b[1].last.localeCompare(a[1].last)).map(([u, p]) => `<tr><td>${esc(u)}</td><td>${p.logins}</td><td>${p.games}</td><td>${dur(p.minutes)}</td><td>${p.last ? when(p.last) : "—"}</td></tr>`).join("")}
  </tbody></table></div>
  <h2 class="sec">Games</h2>
  <p class="note">One row per player's browser. Play time runs from the first move to the last sign of life (sent every five minutes and when the page closes).</p>
  <div class="scrollx"><table class="log"><thead><tr><th>Started</th><th>Account</th><th>Players</th><th>Mode</th><th>Soul</th><th>Lantern</th><th>Turns</th><th>Play time</th><th>Outcome</th><th>Record</th><th>From</th></tr></thead><tbody>
    ${S.length ? S.sort((a, b) => b.start.localeCompare(a.start)).map(s => `<tr><td>${when(s.start)}</td><td>${esc(s.user)}</td><td class="names">${esc((s.names || []).join(", "))}</td><td>${esc(MODES[s.mode] || s.mode)}${s.table ? " · " + esc(s.table) : ""}</td><td>${esc(SOULS[s.soul] || s.soul)}</td><td>${esc(LANTERNS[s.lantern] || "")}</td><td>${s.turn || "—"}</td><td>${dur(mins(s.start, s.last))}</td><td>${resCell(s)}</td><td>${s.detail ? `<button type="button" class="view" data-sid="${esc(s.sid)}">View</button> <button type="button" class="view" data-sid="${esc(s.sid)}" data-chron>Chronicle</button>` : `<span class="res-open">—</span>`}</td><td>${esc(place(s))} · ${esc(s.device || "")}</td></tr>`).join("") : `<tr><td class="empty" colspan="11">No games yet.</td></tr>`}
  </tbody></table></div>
  <p class="note">View opens the game's record: where it ended and why, the table as it stood, every hand, a line per turn and the whole Chronicle. Chronicle jumps straight to the game's log. The record is saved at every new round and when the game ends, so a game closed part-way still has one, up to its last round. Games from before this record existed have none.</p>
  <section class="game" id="gamebox" hidden></section>
  <h2 class="sec">Sign-ins</h2>
  <div class="scrollx"><table class="log"><thead><tr><th>When</th><th>Account</th><th>From</th><th>Device</th></tr></thead><tbody>
    ${Lg.length ? Lg.sort((a, b) => b.at.localeCompare(a.at)).map(l => `<tr><td>${when(l.at)}</td><td>${esc(l.user)}</td><td>${esc(place(l))}</td><td>${esc(l.device)}</td></tr>`).join("") : `<tr><td class="empty" colspan="4">No sign-ins yet.</td></tr>`}
  </tbody></table></div>
  <p class="note">The last 400 games and 400 sign-ins. Places come from Vercel's network data (country and city); no IP addresses are stored.</p>`;
  app.querySelectorAll("button.view").forEach(b => b.onclick = () => openGame(b.dataset.sid, "chron" in b.dataset));
  if (location.hash.length > 1) openGame(location.hash.slice(1).replace(/:chronicle$/, ""), location.hash.endsWith(":chronicle"));
}

// ---------------------------------------------------------------- one game's record
let shown = null;
async function openGame(sid, toChron = false) {
  const box = $("#gamebox");
  if (!box) return;
  document.querySelectorAll("tr.picked").forEach(t => t.classList.remove("picked"));
  document.querySelector(`button.view[data-sid="${CSS.escape(sid)}"]`)?.closest("tr")?.classList.add("picked");
  box.hidden = false;
  box.innerHTML = `<p class="note">Loading the record…</p>`;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  history.replaceState(null, "", `#${sid}${toChron ? ":chronicle" : ""}`);
  const r = await fetch(`/api/stats?sid=${encodeURIComponent(sid)}`, { cache: "no-store" });
  const g = (await r.json().catch(() => ({}))).game;
  shown = g;
  box.innerHTML = g ? gameHTML(g) : `<p class="note">No record was kept for this game.</p>`;
  box.querySelector("[data-close]")?.addEventListener("click", () => { box.hidden = true; history.replaceState(null, "", location.pathname); });
  box.querySelector("[data-download]")?.addEventListener("click", () => downloadChron(g));
  if (g && toChron) box.querySelector("#chronicle")?.scrollIntoView({ behavior: "smooth", block: "start" });
}
const CAUSE = {
  Faded: "Faded: the forgotten pile reached the Lantern's limit",
  Shattered: "Shattered: the third Fracture was taken",
  Deluge: "Deluge: Black Water had to rise with none left in the supply",
  Stalled: "Stalled: the turn limit was reached",
};
const THREADS = [["Obsession", "nb-obsession", "#D7263D"], ["Acceptance", "nb-acceptance", "#E6D3A3"], ["Oblivion", "nb-oblivion", "#8FD6E1"]];
const MANTLES = { weaver: "Root-Weaver", warden: "Spirit Warden", bringer: "Bloom-Bringer", breaker: "Fog-Breaker" };
const REACHES = ["I · The Asphodel Road", "II · The Fields of Mourning", "III · The Banks of Lethe"];
const ic = (id, col) => `<svg class="ic" style="color:${col}"><use href="#${id}"/></svg>`;
function gameHTML(g) {
  const names = g.names || [];
  const res = g.result === "win" ? `<b class="win">The soul crossed.</b>` : g.result === "left" ? `<b class="lose">Left before the end.</b>`
    : g.result === "playing" ? `<b>Not finished: this is the game as it stood at the start of its last round recorded.</b>` : `<b class="lose">Lost · ${esc(CAUSE[g.cause] || g.cause)}.</b>`;
  const who = names.length > 1 ? ` It was ${esc(names[g.cur] || "")}'s turn.` : "";
  const turns = g.turns || [];
  const stats = g.stats || {};
  return `<div class="log-head"><h2>${esc(names.join(", "))} · ${when(g.at)}</h2><button type="button" data-close class="ghost">Close</button></div>
    <p class="why">${res} It ended in <b>round ${g.turn}</b>, in Reach ${esc(REACHES[Math.min(2, g.reach ?? 0)])}, with the soul on space <b>${Math.min(g.soul, 12)}</b> of 12.${who}${g.lastMist ? ` The last Mist card turned was <i>${esc(g.lastMist)}</i>.` : ""}</p>
    ${boardSVG(g)}
    <div class="ggrid">
      <div class="gcard"><h3>Soul board</h3>
        <div>${ic("nb-fog", "#9A948C")} Forgotten <b>${g.forgotten.length}</b> of ${g.limit} <span class="muted">(Ash ${g.ash}${g.adrift < 99 ? `, Adrift ${g.adrift}` : ""})</span></div>
        <div>${ic("nb-fracture", "#D7263D")} Fractures <b>${g.fract}</b> of 3</div>
        <div>${ic("nb-light", "#E6D3A3")} Light <b>${g.light}</b></div>
        <div>${ic("nb-blackwater", "#9A948C")} Black Water left <b>${g.bw}</b> of ${g.bwSupply}</div>
        <div class="muted">Deck ${g.deck} · Discard ${g.discard}</div></div>
      <div class="gcard"><h3>Loom of the Fates</h3>
        ${THREADS.map(([n, id, col], t) => `<div class="thread">${ic(id, col)} <span style="min-width:90px">${n}${g.echo === t ? " · <b>Echo</b>" : ""}</span>${Array.from({ length: g.cap }, (_, k) => `<i class="${k < g.karma[t] ? "on" : ""}"></i>`).join("")}</div>`).join("")}
        <div class="muted">Mantles: ${Object.entries(g.mantles || {}).filter(([, w]) => w).map(([m, w]) => `${MANTLES[m]} (${esc(w)})`).join(", ") || "none taken"}</div></div>
      <div class="gcard"><h3>Hands at the end</h3>${(g.hands || []).map((h, p) => `<div><b>${esc(names[p] || `Player ${p + 1}`)}</b>: ${h.length ? esc(h.join(", ")) : `<span class="muted">empty</span>`}</div>`).join("")}</div>
      <div class="gcard"><h3>Forgotten pile</h3>${g.forgotten.length ? `<ul>${g.forgotten.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : `<span class="muted">Nothing forgotten.</span>`}</div>
      <div class="gcard"><h3>Book of Remembrance</h3>${(g.book || []).map((pg, r) => `<div><b>Chapter ${["I", "II", "III"][r]}</b>${g.blessed?.[r] ? " · blessed" : ""}: ${Object.keys(pg).length ? Object.entries(pg).map(([slot, band]) => `${esc(slot)}: <i>${esc(band)}</i>`).join("; ") : `<span class="muted">empty</span>`}</div>`).join("")}</div>
      <div class="gcard"><h3>Over the game</h3><div class="muted">Resonances ${stats.resonances ?? 0} · Burns ${stats.burns ?? 0} · Backlashes ${stats.backlashes ?? 0} · Lingers ${stats.lingers ?? 0} · Summons ${stats.summons ?? 0} · Inscribed ${stats.inscribed ?? 0} · Blessings ${stats.blessings ?? 0}</div></div>
    </div>
    <h2 class="sec">Turn by turn</h2>
    <div class="scrollx"><table class="log"><thead><tr><th>Round</th><th>Player</th><th>Soul at</th><th>Forgotten</th><th>Fractures</th><th>Light</th><th>Black Water left</th><th>Knots (Obs / Acc / Obl)</th></tr></thead><tbody>
      ${turns.filter(t => t.t > 0).map(t => `<tr><td>${t.t}</td><td>${esc(names[t.p] || "")}</td><td>${Math.min(t.soul, 12)}</td><td>${t.f}</td><td>${t.fr}</td><td>${t.li}</td><td>${t.bw}</td><td>${(t.k || []).join(" / ")}</td></tr>`).join("") || `<tr><td class="empty" colspan="8">No turns recorded.</td></tr>`}
    </tbody></table></div>
    <p class="note">Each line shows the table as it stood at the end of that round's turn.</p>
    <div class="log-head" id="chronicle" style="scroll-margin-top:12px"><h2 class="sec">Chronicle</h2><button type="button" data-download class="ghost">Download as text</button></div>
    <div class="chron">${chronHTML(g.lines || [])}</div>`;
}
// The Chronicle as a plain text file, to keep or share after a playtest.
function downloadChron(g) {
  const head = [`Netherbloom · ${(g.names || []).join(", ")} · ${new Date(g.at).toLocaleString()}`,
    `${g.result === "win" ? "Crossed" : g.result === "left" ? "Left before the end" : g.result === "playing" ? "Not finished" : `Lost: ${CAUSE[g.cause] || g.cause}`} · round ${g.turn} · soul on space ${Math.min(g.soul, 12)}`];
  let turn = -1;
  const body = [];
  for (const [t, , msg] of g.lines || []) { if (t !== turn) { turn = t; body.push("", t ? `— Round ${t} —` : "— Setup —"); } body.push(msg); }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([[...head, ...body].join("\n")], { type: "text/plain" }));
  a.download = `netherbloom-chronicle-${String(g.at).slice(0, 16).replace(/[:T]/g, "-")}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function chronHTML(lines) {
  let out = "", turn = -1;
  for (const [t, kind, msg] of lines) {
    if (t !== turn) { turn = t; out += `<h4>${t ? `Round ${t}` : "Setup"}</h4>`; }
    out += `<div class="k-${esc(kind)}">${esc(msg)}</div>`;
  }
  return out || `<span class="muted">No Chronicle kept.</span>`;
}
// The river as it stood at the end: spaces 1-11 with a bank card on each side, the soul, Black Water on the river.
function boardSVG(g) {
  const X = sp => 46 + sp * 76, RY = 150;
  const TILE = { fertile: ["#3a3226", "nb-fertile", "#b9ae9c"], stony: ["#3d3a37", "nb-stony", "#cfc8bd"], memory: ["#4a3d22", "nb-memorysite", "#E6D3A3"], grave: ["#1d3238", "nb-grave", "#8FD6E1"] };
  let o = `<svg class="gboard" viewBox="0 0 1000 300" role="img" aria-label="The river at the end of the game">
    <rect x="0" y="${RY - 34}" width="1000" height="68" fill="#0b1a20"/>
    <path d="M0 ${RY - 34} H1000 M0 ${RY + 34} H1000" stroke="#2d5a62" stroke-opacity=".6"/>
    <text x="${X(0)}" y="292" text-anchor="middle">near shore</text><text x="${X(12)}" y="292" text-anchor="middle" style="fill:#E6D3A3">Far Shore</text>
    ${[4.5, 8.5].map(x => `<path d="M${X(x)} 8 V292" stroke="#4A4642" stroke-dasharray="4 6"/>`).join("")}`;
  for (let sp = 1; sp <= 11; sp++) {
    o += `<text x="${X(sp)}" y="${RY + 5}" text-anchor="middle" style="fill:#E6D3A3;font-size:14px">${sp}</text>`;
    if (g.flooded?.[sp]) o += `<ellipse cx="${X(sp)}" cy="${RY}" rx="30" ry="24" fill="#000" stroke="#4A4642"/><use href="#nb-blackwater" x="${X(sp) - 14}" y="${RY - 14}" width="28" height="28" style="color:#9A948C"/>`;
    for (const side of [0, 1]) {
      const k = sp * 2 + side, s = g.slots?.[k] || {}, y = side ? RY + 46 : RY - 46 - 92;
      const [fill, icon, col] = s.r ? TILE[s.t] || TILE.fertile : ["#26303a", "nb-fog", "#9A948C"];
      o += `<rect x="${X(sp) - 30}" y="${y}" width="60" height="92" rx="6" fill="${fill}" stroke="#8a6d48" stroke-opacity=".7" opacity="${sp < g.soul ? .45 : 1}"/>`;
      o += `<use href="#${icon}" x="${X(sp) + 10}" y="${y + 70}" width="16" height="16" style="color:${col}" opacity=".9"/>`;
      if (s.g) o += `<use href="#nb-grievance" x="${X(sp) - 18}" y="${y + 28}" width="36" height="36" style="color:#8FD6E1"/>`;
      else if (s.tok === "bloom") o += `<use href="#nb-bloom" x="${X(sp) - 18}" y="${y + 28}" width="36" height="36" style="color:#D7263D"/>`;
      else if (s.tok === "root") o += `<use href="#nb-root" x="${X(sp) - 16}" y="${y + 30}" width="32" height="32" style="color:#E6D3A3"/>`;
    }
  }
  const sx = X(Math.min(g.soul, 12));
  o += `<circle cx="${sx}" cy="${RY}" r="26" fill="#0e0c11" stroke="#E6D3A3" stroke-width="2"/><use href="#nb-soul" x="${sx - 16}" y="${RY - 16}" width="32" height="32" style="color:#EFE7D6"/>`;
  return o + `</svg>`;
}
</script>
</body>
</html>
