<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Netherbloom · Play log</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
/* The play log: who signed in, which games were played and for how long. Read-only, for the site owner. */
.log-wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.log-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; justify-content: space-between; }
.log-head h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; border: 1px solid var(--ash); border-radius: 10px; background: rgba(33,30,37,.88); display: grid; gap: 2px; }
.tile b { font-family: var(--display); font-weight: 400; font-size: 2rem; color: var(--bone); font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mist); }
.scrollx { overflow-x: auto; border: 1px solid var(--ash); border-radius: 10px; background: rgba(23,22,27,.8); }
table.log { display: table; width: 100%; border-collapse: collapse; font-size: .9rem; }
table.log thead { display: table-header-group; } table.log tbody { display: table-row-group; } table.log tr { display: table-row; }
table.log th, table.log td { display: table-cell; }
.log-wrap a { color: var(--cyan); }
table.log th, table.log td { text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(74,70,66,.6); white-space: nowrap; font-variant-numeric: tabular-nums; }
table.log th { font-family: var(--mono); font-weight: 500; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mist); position: sticky; top: 0; background: #1b191f; }
table.log td.names { white-space: normal; min-width: 160px; }
.res-win { color: var(--cyan); } .res-lose { color: var(--crimson); } .res-open { color: var(--mist); }
.empty { padding: 18px; color: var(--mist); }
.note { color: var(--mist); max-width: 75ch; margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select { padding: 5px 8px; }
h2.sec { font-size: 1.3rem; margin: 6px 0 0; }
</style>
</head>
<body>
<div class="coverbg" aria-hidden="true"></div>
<main class="app log-wrap" id="logapp">
  <div class="log-head"><h1>Play log</h1><span><a href="/">Back to the game</a></span></div>
  <p class="note" id="status">Loading…</p>
</main>
<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const SOULS = { child: "Child of the Last Flame", garland: "The Garland Girl", king: "The King on the Barge", bride: "The Bride Who Stayed Below", open: "Open Crossing" };
const LANTERNS = { 1: "Gentle", 2: "Standard", 3: "Hard", 4: "Heroic" };
const MODES = { solo: "Solo", local: "Same screen", online: "Online" };
const when = iso => new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const mins = (a, b) => Math.max(0, (new Date(b) - new Date(a)) / 60000);
const dur = m => m < 1 ? "under 1 min" : m < 60 ? `${Math.round(m)} min` : `${Math.floor(m / 60)} h ${Math.round(m % 60)} min`;
const place = r => [r.city, r.country].filter(Boolean).join(", ") || "—";

const r = await fetch("/api/stats", { cache: "no-store" });
if (r.status === 401 || r.redirected) location.href = "/login";
const d = await r.json().catch(() => ({ ok: false, error: "The play log could not be read." }));
const app = $("#logapp");
if (!d.ok) { $("#status").textContent = d.error || "The play log could not be read."; }
else if (!d.logging) {
  $("#status").innerHTML = "The play log is not switched on yet. In Vercel, open the <b>netherbloom</b> project, go to <b>Storage</b>, create a <b>Blob</b> store (private) and connect it to this project, then redeploy. Sign-ins and games are recorded from then on.";
} else {
  const S = d.sessions, Lg = d.logins;
  const total = S.reduce((t, s) => t + mins(s.start, s.last), 0);
  const users = new Set([...S.map(s => s.user), ...Lg.map(l => l.user)]);
  const finished = S.filter(s => s.result === "win" || s.result === "lose");
  const wins = finished.filter(s => s.result === "win").length;
  const resCell = s => s.result === "win" ? `<span class="res-win">Crossed</span>` : s.result === "lose" ? `<span class="res-lose">Lost${s.cause ? ": " + esc(s.cause) : ""}</span>` : s.result === "left" ? `<span class="res-open">Left early</span>` : `<span class="res-open">In progress / closed</span>`;
  // per account
  const per = {};
  for (const u of users) per[u] = { logins: 0, games: 0, minutes: 0, last: "" };
  for (const l of Lg) { per[l.user].logins++; if (l.at > per[l.user].last) per[l.user].last = l.at; }
  for (const s of S) { per[s.user].games++; per[s.user].minutes += mins(s.start, s.last); if (s.last > per[s.user].last) per[s.user].last = s.last; }
  app.innerHTML = `
  <div class="log-head"><h1>Play log</h1><span><a href="/">Back to the game</a></span></div>
  <section class="tiles">
    <div class="tile"><b>${S.length}</b><span>Games started</span></div>
    <div class="tile"><b>${dur(total).replace(" min", "m").replace(" h ", "h ")}</b><span>Total play time</span></div>
    <div class="tile"><b>${finished.length ? Math.round(wins / finished.length * 100) + "%" : "—"}</b><span>Crossings won (${finished.length} finished)</span></div>
    <div class="tile"><b>${users.size}</b><span>Accounts seen</span></div>
    <div class="tile"><b>${Lg.length}</b><span>Sign-ins</span></div>
  </section>
  <h2 class="sec">By account</h2>
  <div class="scrollx"><table class="log"><thead><tr><th>Account</th><th>Sign-ins</th><th>Games</th><th>Play time</th><th>Last seen</th></tr></thead><tbody>
    ${Object.entries(per).sort((a, b) => b[1].last.localeCompare(a[1].last)).map(([u, p]) => `<tr><td>${esc(u)}</td><td>${p.logins}</td><td>${p.games}</td><td>${dur(p.minutes)}</td><td>${p.last ? when(p.last) : "—"}</td></tr>`).join("")}
  </tbody></table></div>
  <h2 class="sec">Games</h2>
  <p class="note">One row per player's browser. Play time runs from the first move to the last sign of life (sent every five minutes and when the page closes).</p>
  <div class="scrollx"><table class="log"><thead><tr><th>Started</th><th>Account</th><th>Players</th><th>Mode</th><th>Soul</th><th>Lantern</th><th>Turns</th><th>Play time</th><th>Outcome</th><th>From</th></tr></thead><tbody>
    ${S.length ? S.sort((a, b) => b.start.localeCompare(a.start)).map(s => `<tr><td>${when(s.start)}</td><td>${esc(s.user)}</td><td class="names">${esc((s.names || []).join(", "))}</td><td>${esc(MODES[s.mode] || s.mode)}${s.table ? " · " + esc(s.table) : ""}</td><td>${esc(SOULS[s.soul] || s.soul)}</td><td>${esc(LANTERNS[s.lantern] || "")}</td><td>${s.turn || "—"}</td><td>${dur(mins(s.start, s.last))}</td><td>${resCell(s)}</td><td>${esc(place(s))} · ${esc(s.device || "")}</td></tr>`).join("") : `<tr><td class="empty" colspan="10">No games yet.</td></tr>`}
  </tbody></table></div>
  <h2 class="sec">Sign-ins</h2>
  <div class="scrollx"><table class="log"><thead><tr><th>When</th><th>Account</th><th>From</th><th>Device</th></tr></thead><tbody>
    ${Lg.length ? Lg.sort((a, b) => b.at.localeCompare(a.at)).map(l => `<tr><td>${when(l.at)}</td><td>${esc(l.user)}</td><td>${esc(place(l))}</td><td>${esc(l.device)}</td></tr>`).join("") : `<tr><td class="empty" colspan="4">No sign-ins yet.</td></tr>`}
  </tbody></table></div>
  <p class="note">The last 400 games and 400 sign-ins. Places come from Vercel's network data (country and city); no IP addresses are stored.</p>`;
}
</script>
</body>
</html>
